name: Browser Core Journeys

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'manifest.json'
      - 'sw.js'
      - 'js/**'
      - 'css/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/browser-journeys.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'manifest.json'
      - 'sw.js'
      - 'js/**'
      - 'css/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/browser-journeys.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production-equivalent static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/piq-http.log 2>&1 &
          echo $! > /tmp/piq-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/piq-http.log
          exit 1

      - name: Run browser core journeys
        run: npm run test:e2e
        env:
          PIQ_BASE_URL: http://127.0.0.1:4173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
