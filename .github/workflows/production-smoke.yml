name: Production Smoke Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run production JavaScript syntax checks
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run static production smoke checks
        run: node scripts/smoke-static.mjs
      - name: Run load model regression tests
        run: npm run test:load
      - name: Consistency and cloud-mapping unit tests
        run: npm run test:unit
